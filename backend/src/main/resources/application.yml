server:
  port: 8080

spring:
  application:
    name: learnstep-backend
  datasource:
    url: jdbc:mysql://localhost:3306/learnstep_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

learnstep:
  app:
    jwtSecret: learnstepSuperSecretKeyForJWTAuthentication2026WithSufficientByteLengthForHS512Algorithm
    jwtExpirationMs: 86400000
